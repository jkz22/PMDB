# Pipeline configuration. Everything tunable lives here.

data:
  root: data            # batches live at <root>/<batch_name>/*.tif
  detector: BSE         # only *_<detector>.tif images are analysed
  baseline_batch: Batch_2

normalise:
  p_low: 0.5            # percentile clipped to 0
  p_high: 99.5          # percentile clipped to 255

segment:
  gaussian_sigma: 1.0
  n_classes: 4          # pore, graphite, bright, rim (low -> high intensity)
  rim_opening_radius: 3 # disk radius; opening removes thin rim structures
  min_pore_px: 20       # remove pore components smaller than this
  fill_graphite_px: 20  # fill graphite holes smaller than this

instances:
  # brief suggested ~25 but that shatters elongated flakes (1742 vs 543
  # instances on the reference image); 50 matches visible flakes by eye,
  # see qc/instances/compare_min_distance.png
  watershed_min_distance: 50

pixel_size_um: null     # unknown; all KPIs in pixel units until mentors confirm

seed: 0
